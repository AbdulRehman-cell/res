name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm --prefix client install && npm --prefix client run build

      - name: Run tests
        run: npm test

      - name: Deploy to Render
        uses: render-deploy/render-deploy-action@v1
        with:
          service-id: your_render_service_id
          api-key: ${{ secrets.RENDER_API_KEY }}