version: 1
services:
  web:
    type: web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      NODE_ENV: production
      MONGO_URI: your_mongodb_uri_here
    autoDeploy: true
    healthCheck:
      path: /health
      healthyThreshold: 3
      unhealthyThreshold: 3
      checkIntervalSeconds: 30
      timeoutSeconds: 5
      intervalSeconds: 60